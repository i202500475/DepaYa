<div class="card">
  <img [src]="departamento.URL_Imagen" [alt]="departamento.Titulo" class="property-img">
  <span class="location-badge">📍 {{ departamento.Distrito }}</span>

  <div class="card-body">
    <h3 class="property-title">{{ departamento.Titulo }}</h3>

    <div class="features">
      <span>🛏️ {{ departamento.Habitaciones }} Hab.</span>
      <span>🚿 {{ departamento.Banos }} Baños</span>
    </div>

    <div class="card-footer">
      <div class="price-box">
        <span class="amount">S/ {{ departamento.Precio_Noche | number:'1.2-2' }}</span>
        <span class="period">noche</span>
      </div>
    </div>
  </div>
</div>
