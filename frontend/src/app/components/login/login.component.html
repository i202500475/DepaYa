<div class="auth-container">
  <div class="auth-card">
    <h2>Iniciar Sesión</h2>
    <p>Bienvenido de nuevo a DepaYa</p>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="credenciales.email" name="email" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="credenciales.password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-auth">Entrar</button>
    </form>
  </div>
</div>
