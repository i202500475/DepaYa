<div class="auth-container">
  <div class="auth-card">
    <h2>Crear Cuenta</h2>
    <p>Regístrate para empezar a publicar o alquilar</p>

    <form (ngSubmit)="onRegistro()">
      <div class="form-group">
        <label>Nombre Completo</label>
        <input type="text" [(ngModel)]="usuario.nombre" name="nombre" placeholder="Tu nombre" required>
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="usuario.email" name="email" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="usuario.password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-auth">Registrarse</button>
    </form>
  </div>
</div>
